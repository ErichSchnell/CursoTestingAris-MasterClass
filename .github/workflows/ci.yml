name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read
  checks: write
  pull-requests: write


jobs:
  unit-tests:
    name: 🧪 Unit Tests + coverage
    runs-on: ubuntu-latest


    steps:
      - uses: actions/checkout@v4


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :app:koverXmlReportDebug :app:koverHtmlReportDebug :app:koverVerifyDebug

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cobertura -> resumen del run
        if: always()
        run: |
          XML=app/build/reports/kover/reportDEbug.xml
          if [ -f "$XML" ]; then
            echo "## 🧪 Corbertura de líneas (unit)" >> "$GITHUB_STEP_SUMMARY"
            awk -F'"' '/type="LINE"/{=$4;c=$6} END{t=m+c; if(t>0) printf "- **%d%%** (%d/%d líneas) - gate mínimo: 20%%\n", c*100/t, c, t}' "$XML" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Unit test results
          files: app/build/test-results/testDebugUnitTest/**/*.xml

  build:
    name: 🏗️ Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20


    steps:
      - uses: actions/checkout@v4


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Assemble debug
        run: ./gradlew :app:assembleDebug


      - name: Make gradlew executable
        run: chmod +x ./gradlew


      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  static-analysis:
    name: 🔎 Static analysis ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 15


    steps:
      - uses: actions/checkout@v4


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: ktlint
        run: ./gradlew :app:ktlintCheck


      - name: Make gradlew executable
        run: chmod +x ./gradlew


      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
